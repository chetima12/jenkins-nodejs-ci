apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    {{- include "jenkins-nodejs-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: http
      protocol: TCP
      name: metrics
  selector:
    app: {{ .Release.Name }}
    {{- include "jenkins-nodejs-app.selectorLabels" . | nindent 4 }}
