apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-app
  namespace: jenkins-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs-app
          image: 171226592813.dkr.ecr.us-east-1.amazonaws.com/jenkins-nodejs-app:v1.0.0

          ports:
            - containerPort: 3000
