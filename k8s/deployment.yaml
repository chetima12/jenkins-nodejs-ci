apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-app
  namespace: jenkins-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs-app
          image: chetima/nodejs-ci:23

          ports:
            - containerPort: 3000
