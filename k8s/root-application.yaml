apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/chetima12/jenkins-nodejs-ci.git'
    targetRevision: main
    path: helm/jenkins-nodejs-app
    helm:
      releaseName: jenkins-nodejs-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nodejs-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
